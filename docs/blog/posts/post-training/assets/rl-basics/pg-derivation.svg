<svg class="rl-roadmap" viewBox="0 0 720 532" role="img" aria-label="策略梯度推导路线图：左侧主线从参数化目标 J(θ) 经分布导数积分、对数概率梯度期望到无模型策略梯度公式；右侧展示直接求导的两个卡点，以及对数导数恒等式与两侧取对数消去环境项两步解法。">
<defs><marker id="pgd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="rl-arrowhead" d="M0 1 L9 5 L0 9 Z"/></marker></defs>
<rect class="rl-band" x="18" y="16" width="332" height="500" rx="14"/>
<text class="rl-lane-label rl-policy" x="184" y="48" text-anchor="middle">推导主线 · Derivation</text>
<rect class="rl-band" x="382" y="16" width="320" height="500" rx="14"/>
<text class="rl-lane-label rl-value" x="542" y="48" text-anchor="middle">卡点与关键变换 · Key Tricks</text>
<path class="rl-edge" d="M 184 138 V 188" marker-end="url(#pgd-arrow)"/>
<text class="rl-edge-label" x="196" y="168" text-anchor="start">展开期望并对 θ 求导</text>
<path class="rl-edge" d="M 184 258 V 308" marker-end="url(#pgd-arrow)"/>
<text class="rl-edge-label" x="196" y="288" text-anchor="start">代入恒等式，还原期望</text>
<path class="rl-edge" d="M 184 378 V 428" marker-end="url(#pgd-arrow)"/>
<text class="rl-edge-label" x="196" y="408" text-anchor="start">消去环境项，仅留策略项</text>
<path class="rl-edge rl-borrow" d="M 332 214 L 398 148" marker-end="url(#pgd-arrow)"/>
<path class="rl-edge rl-borrow" d="M 400 326 H 335" marker-end="url(#pgd-arrow)"/>
<path class="rl-edge rl-borrow" d="M 400 462 H 335" marker-end="url(#pgd-arrow)"/>
<g class="rl-node rl-policy"><rect x="36" y="70" width="296" height="68" rx="10"/><text class="rl-title" x="184" y="98" text-anchor="middle">1. 参数化优化目标</text><text class="rl-sub" x="184" y="121" text-anchor="middle">J(θ) = E[G(τ)] = ∫ p<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>(τ) G(τ) dτ</text></g>
<g class="rl-node rl-policy"><rect x="36" y="190" width="296" height="68" rx="10"/><text class="rl-title" x="184" y="218" text-anchor="middle">2. 轨迹分布导数积分</text><text class="rl-sub" x="184" y="241" text-anchor="middle">∇<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>J(θ) = ∫ ∇<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>p<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>(τ) · G(τ) dτ</text></g>
<g class="rl-node rl-policy"><rect x="36" y="310" width="296" height="68" rx="10"/><text class="rl-title" x="184" y="338" text-anchor="middle">3. 对数概率梯度期望</text><text class="rl-sub" x="184" y="361" text-anchor="middle">∇<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>J(θ) = E[ ∇<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan> log p<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>(τ) · G(τ) ]</text></g>
<g class="rl-node rl-green"><rect x="36" y="430" width="296" height="68" rx="10"/><text class="rl-title" x="184" y="458" text-anchor="middle">4. 无模型策略梯度</text><text class="rl-sub" x="184" y="481" text-anchor="middle">E[ (∑<tspan dy="3.5" font-size="13">t</tspan><tspan dy="-3.5">​</tspan> ∇<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan> log π<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>(a<tspan dy="3.5" font-size="13">t</tspan><tspan dy="-3.5">​</tspan> | s<tspan dy="3.5" font-size="13">t</tspan><tspan dy="-3.5">​</tspan>)) G(τ) ]</text></g>
<rect class="rl-deep" x="400" y="70" width="284" height="112" rx="10"/>
<text class="rl-title" x="542" y="98" text-anchor="middle">直接求导的两个卡点</text>
<text class="rl-sub" x="542" y="124" text-anchor="middle">① ∇<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>p<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>(τ) 非分布，无法采样估计</text>
<text class="rl-sub" x="542" y="148" text-anchor="middle">② p<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>(τ) 连乘含未知转移 P(s′ | s, a)</text>
<g class="rl-node rl-value"><rect x="400" y="270" width="284" height="108" rx="10"/><text class="rl-title" x="542" y="298" text-anchor="middle">技巧一：对数导数恒等式</text><text class="rl-sub" x="542" y="324" text-anchor="middle">∇<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>p<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>(τ) = p<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>(τ) · ∇<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan> log p<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>(τ)</text><text class="rl-sub" x="542" y="348" text-anchor="middle">重凑密度 p<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan>(τ)，把积分变回期望</text></g>
<g class="rl-node rl-value"><rect x="400" y="396" width="284" height="108" rx="10"/><text class="rl-title" x="542" y="424" text-anchor="middle">技巧二：两侧取 log 消环境项</text><text class="rl-sub" x="542" y="450" text-anchor="middle">log p(s<tspan dy="3.5" font-size="13">0</tspan><tspan dy="-3.5">​</tspan>) + ∑ log π<tspan dy="3.5" font-size="13">θ</tspan><tspan dy="-3.5">​</tspan> + ∑ log P</text><text class="rl-lane-label rl-red" x="542" y="482" text-anchor="middle">p(s<tspan dy="3.5" font-size="13">0</tspan><tspan dy="-3.5">​</tspan>) 与 P 与 θ 无关，求导归零</text></g>
<path class="rl-strike" d="M 442 456 L 498 439"/>
<path class="rl-strike" d="M 595 456 L 644 439"/>
</svg>
