<g class="rl-node rl-policy"><rect x="240" y="28" width="220" height="64" rx="10"/><text class="rl-title" x="350" y="56" text-anchor="middle">智能体 · Agent</text><text class="rl-sub" x="350" y="77" text-anchor="middle">依据策略 π(a | s) 选择动作</text></g>
