<text class="rl-edge-label" x="102" y="116" text-anchor="end">当前状态 <tspan font-style="italic">S</tspan><tspan dy="3" font-size="10">t</tspan></text>
<text class="rl-lane-label rl-value" x="102" y="172" text-anchor="end">下一状态 <tspan font-style="italic">S</tspan><tspan dy="3" font-size="10">t+1</tspan></text>
<text class="rl-edge-label" x="184" y="116" text-anchor="start">奖励 <tspan font-style="italic">R</tspan><tspan dy="3" font-size="10">t</tspan></text>
