<svg class="rl-roadmap" viewBox="0 0 680 280" role="img" aria-label="强化学习智能体与环境交互闭环：智能体在时刻 t 接收状态 S_t 与奖励 R_t，依据策略输出动作 A_t；环境接收动作后发生状态转移并反馈下一状态 S_{t+1} 与即时奖励 R_{t+1}。">
