<g class="rl-node rl-green"><rect x="432" y="32" width="256" height="64" rx="10"/><text class="rl-title" x="560" y="60" text-anchor="middle">寻找更优策略 π′</text><text class="rl-sub" x="560" y="81" text-anchor="middle">使 <tspan font-style="italic">Q</tspan><tspan dy="4.5" font-size="13">π</tspan><tspan dy="-4.5">​</tspan>(<tspan font-style="italic">s</tspan>, π′(<tspan font-style="italic">s</tspan>)) ≥ <tspan font-style="italic">V</tspan><tspan dy="4.5" font-size="13">π</tspan><tspan dy="-4.5">​</tspan>(<tspan font-style="italic">s</tspan>)</text></g>
