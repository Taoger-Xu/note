<text class="rl-lane-label rl-policy" x="234" y="346" text-anchor="middle">π = greedy(<tspan font-style="italic">Q</tspan><tspan dy="4.5" font-size="13">π</tspan><tspan dy="-4.5">​</tspan>)</text>
