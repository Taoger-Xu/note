<svg class="rl-roadmap" viewBox="0 0 720 392" role="img" aria-label="价值评估指导策略提升：先评估当前策略 π 的价值 V_π，再贪心选择使 Q_π(s, π′(s)) ≥ V_π(s) 的新策略 π′，交替迭代收敛至最优 V* 与 π*。">
