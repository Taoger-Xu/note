<text class="rl-sub" x="440" y="282" text-anchor="start">其中 <tspan font-style="italic">G</tspan>(<tspan font-style="italic">τ</tspan>) = ∑<tspan dy="4" font-size="12.5" font-style="italic">t</tspan><tspan dy="-4">​</tspan> <tspan font-style="italic">R</tspan>(<tspan font-style="italic">s</tspan><tspan dy="4" font-size="12.5" font-style="italic">t</tspan><tspan dy="-4">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="4" font-size="12.5" font-style="italic">t</tspan><tspan dy="-4">​</tspan>)</text>
<text class="rl-math" x="440" y="361" text-anchor="start"><tspan font-style="italic">θ</tspan> ← <tspan font-style="italic">θ</tspan> + <tspan font-style="italic">α</tspan> ∇<tspan dy="4" font-size="12.5" font-style="italic">θ</tspan><tspan dy="-4">​</tspan><tspan font-style="italic">J</tspan>(<tspan font-style="italic">θ</tspan>)</text>
