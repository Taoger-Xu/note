<text class="rl-math" x="248" y="138" text-anchor="start">= <tspan font-style="italic">p</tspan>(<tspan font-style="italic">s</tspan><tspan dy="4" font-size="12.5">0</tspan><tspan dy="-4">​</tspan>)</text>
