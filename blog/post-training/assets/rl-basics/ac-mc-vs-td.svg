<svg class="rl-roadmap" viewBox="0 0 720 584" role="img" aria-label="利用收集轨迹拟合价值网络 V_ϕ(s) 的两种方式对比：上方为蒙特卡洛（MC）回归目标与函数近似在相近状态间的隐式平滑；中间为时序差分（TD）自举目标，复用已拟合的价值网络降低方差；下方为统一的均方误差监督回归损失。">
<defs>
<marker id="acmctd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path class="rl-arrowhead" d="M0 1 L9 5 L0 9 Z"/></marker>
<marker id="acmctd-red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path fill="var(--rl-red)" d="M0 1 L9 5 L0 9 Z"/></marker>
</defs>
<rect class="rl-band" x="16" y="14" width="440" height="234" rx="14"/>
<text class="rl-lane-label rl-policy" x="32" y="42" text-anchor="start">方式一：蒙特卡洛回归目标（Monte Carlo Target）</text>
<text class="rl-math" x="32" y="76" text-anchor="start"><tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13">π</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>) ≈ <tspan font-style="italic">G</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan> = ∑<tspan dy="3.5" font-size="13">t′=t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">T−1</tspan><tspan dy="5.5">​</tspan> <tspan font-style="italic">γ</tspan><tspan dy="-5.5" font-size="13">t′−t</tspan><tspan dy="5.5">​</tspan> <tspan font-style="italic">R</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13">t′</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13">t′</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>)</text>
<text class="rl-sub" x="32" y="106" text-anchor="start">虽无法在同一状态重采 <tspan font-style="italic">N</tspan> 次求平均，拟合效果依然不错：</text>
<text class="rl-sub" x="32" y="128" text-anchor="start">连续函数 <tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan>) 在相近状态上共享参数，隐式平滑多条样本</text>
<path class="rl-deep" d="M 32 146 H 440"/>
<text class="rl-sub" x="32" y="184" text-anchor="start">训练数据：</text>
<text class="rl-math" x="100" y="184" text-anchor="start">{ ( <tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>,  <tspan fill="var(--rl-policy)">∑<tspan dy="3.5" font-size="13">t′=t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">T−1</tspan><tspan dy="5.5">​</tspan> <tspan font-style="italic">γ</tspan><tspan dy="-5.5" font-size="13">t′−t</tspan><tspan dy="5.5">​</tspan> <tspan font-style="italic">R</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13">t′</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13">t′</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>)</tspan> ) }</text>
<path class="rl-brace" d="M 166.0 194.0 Q 166.0 198.2 172.5 198.2 H 264.5 Q 271.0 198.2 271.0 202.5 Q 271.0 198.2 277.5 198.2 H 369.5 Q 376.0 198.2 376.0 194.0"/>
<text class="rl-lane-label rl-policy" x="184" y="224" text-anchor="start"><tspan font-style="italic">y</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan> = <tspan font-style="italic">G</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>（MC 回归标签）</text>
<rect class="rl-band" x="470" y="14" width="234" height="234" rx="14"/>
<text class="rl-lane-label rl-value" x="587" y="42" text-anchor="middle">函数近似的隐式平均</text>
<path class="rl-edge" stroke-width="2.0" d="M 488 180 C 498 166, 504 154, 520 140 C 530 106, 542 78, 568 58" marker-end="url(#acmctd-arrow)"/>
<path class="rl-edge" stroke-width="2.0" d="M 504 186 C 516 172, 524 162, 540 150 C 562 126, 590 102, 624 70" marker-end="url(#acmctd-arrow)"/>
<ellipse cx="530" cy="145" rx="25" ry="15" transform="rotate(26 530 145)" fill="var(--rl-red)" fill-opacity="0.08" stroke="var(--rl-red)" stroke-width="2.2"/>
<circle cx="520" cy="140" r="5.5" fill="var(--rl-green)" stroke="var(--md-default-bg-color)" stroke-width="1.6"/>
<circle cx="540" cy="150" r="5.5" fill="var(--rl-green)" stroke="var(--md-default-bg-color)" stroke-width="1.6"/>
<path fill="none" stroke="var(--rl-red)" stroke-width="1.6" d="M 556 148 L 634 78" marker-end="url(#acmctd-red-arrow)"/>
<text class="rl-sub" x="614" y="132" text-anchor="start" fill="var(--rl-red)">累加 <tspan font-style="italic">G</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan></text>
<text class="rl-lane-label rl-red" x="500" y="210" text-anchor="start">同一网络 <tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan> 同时拟合</text>
<text class="rl-sub" x="587" y="232" text-anchor="middle">红圈内相近状态的多个样本！</text>
<rect class="rl-band" x="16" y="262" width="688" height="192" rx="14"/>
<text class="rl-lane-label rl-value" x="32" y="290" text-anchor="start">方式二：时序差分自举目标（Bootstrapped / TD Target）</text>
<text class="rl-sub" x="28" y="325" text-anchor="start">理想目标：</text>
<text class="rl-math" x="98" y="326" text-anchor="start">𝔼<tspan dy="3.5" font-size="13">π</tspan><tspan dy="-3.5">​</tspan>[<tspan font-style="italic">G</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan> | <tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>] ≈ <tspan font-style="italic">R</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>) + <tspan font-style="italic">γ</tspan><tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13">π</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13">t+1</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>) ≈ <tspan font-style="italic">R</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>) + <tspan fill="var(--rl-green)"><tspan font-style="italic">γ</tspan><tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13">t+1</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>)</tspan></text>
<path class="rl-brace" d="M 568.0 335.0 Q 568.0 339.0 574.5 339.0 H 606.5 Q 613.0 339.0 613.0 343.0 Q 613.0 339.0 619.5 339.0 H 651.5 Q 658.0 339.0 658.0 335.0"/>
<text class="rl-lane-label rl-green" x="684" y="362" text-anchor="end">直接复用上一轮已拟合的价值网络（自举 / Bootstrapped）！</text>
<path class="rl-deep" d="M 32 376 H 688"/>
<text class="rl-sub" x="32" y="408" text-anchor="start">训练数据：</text>
<text class="rl-math" x="100" y="408" text-anchor="start">{ ( <tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>,  <tspan fill="var(--rl-value)"><tspan font-style="italic">R</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>) + <tspan font-style="italic">γ</tspan><tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13">t+1</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>)</tspan> ) }</text>
<path class="rl-brace" d="M 166.0 417.0 Q 166.0 421.0 172.5 421.0 H 264.5 Q 271.0 421.0 271.0 425.0 Q 271.0 421.0 277.5 421.0 H 369.5 Q 376.0 421.0 376.0 417.0"/>
<text class="rl-lane-label rl-value" x="196" y="442" text-anchor="start"><tspan font-style="italic">y</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>（TD 自举回归标签）</text>
<rect class="rl-callout" x="436" y="386" width="252" height="54" rx="9"/>
<text class="rl-sub" x="562" y="408" text-anchor="middle">对比 MC：无需跑完轨迹累加随机奖励</text>
<text class="rl-lane-label rl-value" x="562" y="429" text-anchor="middle">仅含单步随机性，标签方差大幅降低</text>
<rect class="rl-band" x="16" y="468" width="688" height="102" rx="14"/>
<text class="rl-lane-label rl-green" x="32" y="494" text-anchor="start">统一监督回归训练（Supervised Regression）：最小化均方误差损失</text>
<text class="rl-math" x="50" y="538" text-anchor="start">ℒ(<tspan font-style="italic">ϕ</tspan>) =</text>
<text class="rl-math-sm" x="118" y="525" text-anchor="middle">1</text>
<path class="rl-brace" stroke-opacity="0.85" d="M 108 532 H 128"/>
<text class="rl-math-sm" x="118" y="549" text-anchor="middle">2</text>
<text class="rl-math-op" x="148.0" y="540.0" text-anchor="middle">∑</text>
<text class="rl-math-sm" x="148.0" y="556.0" text-anchor="middle">i=1</text>
<text class="rl-math-sm" x="148.0" y="516.0" text-anchor="middle">N</text>
<text class="rl-math-op" x="190.0" y="540.0" text-anchor="middle">∑</text>
<text class="rl-math-sm" x="190.0" y="556.0" text-anchor="middle">t=0</text>
<text class="rl-math-sm" x="190.0" y="516.0" text-anchor="middle">T−1</text>
<text class="rl-math" x="214" y="538" text-anchor="start">( <tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan>) − <tspan font-style="italic">y</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan> )<tspan dy="-5.5" font-size="13">2</tspan><tspan dy="5.5">​</tspan></text>
<text class="rl-sub" x="412" y="538" text-anchor="start">（<tspan font-style="italic">y</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(i)</tspan><tspan dy="5.5">​</tspan> 视为固定标签，不回传梯度）</text>
</svg>
