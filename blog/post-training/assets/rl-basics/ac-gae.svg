<g class="rl-node rl-value"><rect x="32" y="532" width="188" height="76" rx="10"/><text class="rl-title" x="126" y="556" text-anchor="middle">λ = 0（一步 TD）</text><text class="rl-sub" x="84" y="578" text-anchor="start">仅保留首项 <tspan font-style="italic">δ</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan></text><text class="rl-sub" x="126" y="598" text-anchor="middle">方差最低 · 偏差最大</text></g>
<g class="rl-node rl-green"><rect x="260" y="532" width="200" height="76" rx="10"/><text class="rl-title" x="360" y="556" text-anchor="middle">λ ≈ 0.95（GAE 折中）</text><text class="rl-sub" x="302" y="578" text-anchor="start">指数衰减远期 <tspan font-style="italic">δ</tspan><tspan dy="3.5" font-size="13">t+l</tspan><tspan dy="-3.5">​</tspan></text><text class="rl-sub" x="360" y="598" text-anchor="middle">近期低偏 · 远期低方差</text></g>
<g class="rl-node rl-policy"><rect x="500" y="532" width="188" height="76" rx="10"/><text class="rl-title" x="594" y="556" text-anchor="middle">λ = 1（蒙特卡洛）</text><text class="rl-sub" x="540" y="578" text-anchor="start">还原 <tspan font-style="italic">G</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan> − <tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan>)</text><text class="rl-sub" x="594" y="598" text-anchor="middle">严格无偏 · 方差最高</text></g>
