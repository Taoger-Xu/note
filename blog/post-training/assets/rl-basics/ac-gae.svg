<text class="rl-math-sm" x="536" y="192" text-anchor="start">× <tspan fill="var(--rl-policy)" font-weight="700"><tspan font-style="italic">λ</tspan></tspan><tspan dy="-5.5" font-size="13">T−t−1</tspan><tspan dy="5.5">​</tspan></text>
<path class="rl-deep" d="M 32 212 H 688"/>
<text class="rl-math" x="32" y="246" text-anchor="start"><tspan font-style="italic">Â</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">GAE(γ,λ)</tspan><tspan dy="5.5">​</tspan> = ∑<tspan dy="3.5" font-size="13">l=0</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">T−t−1</tspan><tspan dy="5.5">​</tspan> (<tspan fill="var(--rl-value)" font-weight="700"><tspan font-style="italic">γ</tspan></tspan><tspan fill="var(--rl-policy)" font-weight="700"><tspan font-style="italic">λ</tspan></tspan>)<tspan dy="-5.5" font-size="13">l</tspan><tspan dy="5.5">​</tspan> <tspan font-style="italic">δ</tspan><tspan dy="3.5" font-size="13">t+l</tspan><tspan dy="-3.5">​</tspan>，   其中 <tspan font-style="italic">δ</tspan><tspan dy="3.5" font-size="13">t+l</tspan><tspan dy="-3.5">​</tspan> = <tspan font-style="italic">R</tspan><tspan dy="3.5" font-size="13">t+l</tspan><tspan dy="-3.5">​</tspan> + <tspan fill="var(--rl-value)" font-weight="700"><tspan font-style="italic">γ</tspan></tspan><tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13">t+l+1</tspan><tspan dy="-3.5">​</tspan>) − <tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13">t+l</tspan><tspan dy="-3.5">​</tspan>)</text>
<rect class="rl-band" x="16" y="282" width="336" height="194" rx="14"/>
<rect x="16" y="282" width="336" height="194" rx="14" fill="none" stroke="var(--rl-policy)" stroke-opacity="0.45" stroke-width="1.5"/>
<text class="rl-lane-label rl-policy" x="32" y="310" text-anchor="start">控制变量一：<tspan font-style="italic">λ</tspan> ∈ [0, 1]（估计器权衡旋钮）</text>
<text class="rl-sub" x="32" y="338" text-anchor="start">• 出现位置：仅在外层衰减权重 (γ<tspan fill="var(--rl-policy)" font-weight="700"><tspan font-style="italic">λ</tspan></tspan>)<tspan dy="-5.5" font-size="13">l</tspan><tspan dy="5.5">​</tspan> 中</text>
<text class="rl-sub" x="32" y="364" text-anchor="start">• 控制对象：真实奖励（橙）与 <tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan> 自举（蓝）比例</text>
<text class="rl-sub" x="32" y="390" text-anchor="start">• 偏差性质：若 <tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan> = <tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13">π</tspan><tspan dy="-3.5">​</tspan> 完全准确，任意 <tspan font-style="italic">λ</tspan> 均无偏；</text>
<text class="rl-sub" x="44" y="414" text-anchor="start"><tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan> 有误差时，调小 <tspan font-style="italic">λ</tspan> 用小偏差换大幅降方差</text>
<rect x="32" y="430" width="304" height="30" rx="7" fill="var(--rl-policy)" fill-opacity="0.08" stroke="var(--rl-policy)" stroke-opacity="0.4" stroke-width="1.2"/>
<text class="rl-lane-label rl-policy" x="56" y="450" text-anchor="start"><tspan font-style="italic">λ</tspan> 决定“怎么估优势”（不改回报定义）</text>
<rect class="rl-band" x="368" y="282" width="336" height="194" rx="14"/>
<rect x="368" y="282" width="336" height="194" rx="14" fill="none" stroke="var(--rl-value)" stroke-opacity="0.45" stroke-width="1.5"/>
<text class="rl-lane-label rl-value" x="384" y="310" text-anchor="start">控制变量二：<tspan font-style="italic">γ</tspan> ∈ [0, 1]（未来视野尺度旋钮）</text>
<text class="rl-sub" x="384" y="338" text-anchor="start">• 出现位置：同时在 (<tspan fill="var(--rl-value)" font-weight="700"><tspan font-style="italic">γ</tspan></tspan>λ)<tspan dy="-5.5" font-size="13">l</tspan><tspan dy="5.5">​</tspan> 与 <tspan font-style="italic">δ</tspan><tspan dy="3.5" font-size="13">t+l</tspan><tspan dy="-3.5">​</tspan> 内部 <tspan fill="var(--rl-value)" font-weight="700"><tspan font-style="italic">γ</tspan></tspan><tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan> 中</text>
<text class="rl-sub" x="384" y="364" text-anchor="start">• 控制对象：远期奖励折扣视野（约 1/(1−<tspan font-style="italic">γ</tspan>) 步）</text>
<text class="rl-sub" x="384" y="390" text-anchor="start">• 偏差性质：即便 <tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan> = <tspan font-style="italic">V</tspan><tspan dy="3.5" font-size="13">π</tspan><tspan dy="-3.5">​</tspan> 完全准确，调小 <tspan font-style="italic">γ</tspan> 也会</text>
<text class="rl-sub" x="396" y="414" text-anchor="start">压低远期奖励使目标变短视，同时降低方差</text>
<rect x="384" y="430" width="304" height="30" rx="7" fill="var(--rl-value)" fill-opacity="0.08" stroke="var(--rl-value)" stroke-opacity="0.4" stroke-width="1.2"/>
<text class="rl-lane-label rl-value" x="408" y="450" text-anchor="start"><tspan font-style="italic">γ</tspan> 决定“优化什么目标”（改变价值定义）</text>
<rect class="rl-band" x="16" y="490" width="688" height="132" rx="14"/>
<text class="rl-lane-label rl-green" x="32" y="516" text-anchor="start">固定 <tspan font-style="italic">γ</tspan> 时，调节 <tspan font-style="italic">λ</tspan> ∈ [0, 1] 在一步 TD 与蒙特卡洛 MC 之间的连续过渡：</text>
