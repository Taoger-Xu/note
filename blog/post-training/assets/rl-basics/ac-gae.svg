<text class="rl-math-sm" x="32" y="192" text-anchor="start">MC <tspan font-style="italic">Â</tspan><tspan dy="3.5" font-size="13" font-style="italic">t</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">(T−t)</tspan><tspan dy="5.5">​</tspan></text>
<line x1="138" y1="188" x2="384" y2="188" stroke="var(--rl-policy)" stroke-width="3.2" stroke-linecap="round"/>
