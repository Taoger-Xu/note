<svg class="rl-roadmap" viewBox="0 0 720 492" role="img" aria-label="从带经验回放池的 Off-Policy Actor-Critic 导出 Q-Learning：用 argmax Q_ϕ 的隐式贪心策略替代显式策略网络 π_θ，删去策略梯度更新步骤（第 4、5 步），第 2 步对动作的期望直接变成 max_{a′} Q_ϕ(s_i′, a′)。">
<defs>
<marker id="acql-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path class="rl-arrowhead" d="M0 1 L9 5 L0 9 Z"/></marker>
<marker id="acql-green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path fill="var(--rl-green)" d="M0 1 L9 5 L0 9 Z"/></marker>
</defs>
<rect class="rl-band" x="16" y="14" width="688" height="272" rx="14"/>
<text class="rl-lane-label rl-value" x="32" y="42" text-anchor="start">带经验回放池的 Off-Policy Actor-Critic 算法流程：</text>
<path fill="none" stroke="var(--rl-green)" stroke-opacity="0.75" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" d="M 52 250 H 38 Q 30 250 30 242 V 90 Q 30 82 38 82 H 50" marker-end="url(#acql-green-arrow)"/>
<text class="rl-math" x="58" y="86" text-anchor="start">1. 按 <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan> ~ <tspan font-style="italic">π</tspan><tspan dy="3.5" font-size="13" font-style="italic">θ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">a</tspan> | <tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>) 交互得 (<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>, <tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>′)</text>
<text class="rl-math" x="58" y="128" text-anchor="start">2. 算目标 <tspan font-style="italic">y</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan> = <tspan font-style="italic">R</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>) + <tspan font-style="italic">γ</tspan> 𝔼<tspan dy="3.5" font-size="13">a′~π</tspan><tspan dy="-3.5">​</tspan>[ <tspan font-style="italic">Q</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>′, <tspan font-style="italic">a</tspan>′) ]</text>
<text class="rl-math" x="58" y="170" text-anchor="start">3. 更新 <tspan font-style="italic">ϕ</tspan>：∇<tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan> ∑<tspan dy="3.5" font-size="13">i=1</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">B</tspan><tspan dy="5.5">​</tspan> ( <tspan font-style="italic">Q</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>) − <tspan font-style="italic">y</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan> )<tspan dy="-5.5" font-size="13">2</tspan><tspan dy="5.5">​</tspan></text>
<text class="rl-math" x="58" y="212" text-anchor="start" fill-opacity="0.72">4. ∇<tspan dy="3.5" font-size="13" font-style="italic">θ</tspan><tspan dy="-3.5">​</tspan><tspan font-style="italic">J</tspan>(<tspan font-style="italic">θ</tspan>) ≈ ∑<tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan> 𝔼<tspan dy="3.5" font-size="13">a~π</tspan><tspan dy="-3.5">​</tspan>[ ∇<tspan dy="3.5" font-size="13" font-style="italic">θ</tspan><tspan dy="-3.5">​</tspan> log <tspan font-style="italic">π</tspan><tspan dy="3.5" font-size="13" font-style="italic">θ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">a</tspan> | <tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>) <tspan font-style="italic">Q</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>, <tspan font-style="italic">a</tspan>) ]</text>
<path class="rl-strike" d="M 54 206 H 444"/>
<text class="rl-math" x="58" y="254" text-anchor="start" fill-opacity="0.72">5. <tspan font-style="italic">θ</tspan> ← <tspan font-style="italic">θ</tspan> + <tspan font-style="italic">α</tspan>∇<tspan dy="3.5" font-size="13" font-style="italic">θ</tspan><tspan dy="-3.5">​</tspan><tspan font-style="italic">J</tspan>(<tspan font-style="italic">θ</tspan>)</text>
<path class="rl-strike" d="M 54 248 H 222"/>
<text class="rl-lane-label rl-red" x="238" y="253" text-anchor="start">← 改用隐式策略后无需参数 <tspan font-style="italic">θ</tspan>，直接省去 4、5 步！</text>
<text class="rl-sub" x="442" y="46" text-anchor="start">存入 (<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>, <tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>′)</text>
<path class="rl-edge" stroke-width="1.8" d="M 424 78 Q 490 46 554 80" marker-end="url(#acql-arrow)"/>
<path d="M 562 72 V 144 A 62 12 0 0 0 686 144 V 72 Z" fill="currentColor" fill-opacity="0.09" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
<ellipse cx="624" cy="72" rx="62" ry="12" fill="var(--md-default-bg-color)" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
<ellipse cx="624" cy="72" rx="62" ry="12" fill="var(--rl-value)" fill-opacity="0.12"/>
<text class="rl-lane-label rl-value" x="624" y="111" text-anchor="middle">Replay Buffer</text>
<text class="rl-sub" x="624" y="132" text-anchor="middle">经验回放池</text>
<path class="rl-brace" stroke-width="1.8" stroke-opacity="0.8" d="M 458.0 112.0 Q 463.0 112.0 463.0 118.5 V 159.5 Q 463.0 166.0 468.0 166.0 Q 463.0 166.0 463.0 172.5 V 213.5 Q 463.0 220.0 458.0 220.0"/>
<text class="rl-sub" x="478" y="176" text-anchor="start">从回放池采样 mini-batch：</text>
<text class="rl-math-sm" x="478" y="200" text-anchor="start">{ (<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>, <tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>′) }<tspan dy="3.5" font-size="13">i=1</tspan><tspan dy="-3.5">​</tspan><tspan dy="-5.5" font-size="13">B</tspan><tspan dy="5.5">​</tspan></text>
<rect class="rl-band" x="16" y="300" width="688" height="178" rx="14"/>
<text class="rl-lane-label rl-green" x="32" y="328" text-anchor="start">退化为 Q-Learning：用隐式贪心策略替代 <tspan font-style="italic">π</tspan><tspan dy="3.5" font-size="13" font-style="italic">θ</tspan><tspan dy="-3.5">​</tspan>，期望自动变成 max</text>
<text class="rl-math" x="30" y="372" text-anchor="start"><tspan font-style="italic">y</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan> = <tspan font-style="italic">R</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>) + <tspan font-style="italic">γ</tspan> 𝔼<tspan dy="3.5" font-size="13">a′~π</tspan><tspan dy="-3.5">​</tspan>[ <tspan font-style="italic">Q</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>′, <tspan font-style="italic">a</tspan>′) ]</text>
<path fill="none" stroke="var(--rl-green)" stroke-width="2.2" d="M 230 426 V 384" marker-end="url(#acql-green-arrow)"/>
<text class="rl-sub" x="242" y="410" text-anchor="start" fill="var(--rl-green)">代入隐式策略</text>
<text class="rl-math" x="48" y="452" text-anchor="start"><tspan font-style="italic">y</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan> = <tspan font-style="italic">R</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>, <tspan font-style="italic">a</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>) + <tspan fill="var(--rl-green)"><tspan font-style="italic">γ</tspan> max<tspan dy="3.5" font-size="13">a′</tspan><tspan dy="-3.5">​</tspan> <tspan font-style="italic">Q</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan><tspan dy="3.5" font-size="13" font-style="italic">i</tspan><tspan dy="-3.5">​</tspan>′, <tspan font-style="italic">a</tspan>′)</tspan></text>
<rect class="rl-callout" x="358" y="346" width="330" height="116" rx="10"/>
<text class="rl-lane-label rl-policy" x="374" y="372" text-anchor="start">关键设想（a funny idea）：隐式策略</text>
<text class="rl-math" x="374" y="424" text-anchor="start"><tspan font-style="italic">π</tspan>(<tspan font-style="italic">a</tspan> | <tspan font-style="italic">s</tspan>) =</text>
<path class="rl-brace" stroke-width="1.6" stroke-opacity="0.8" d="M 464.0 388.0 Q 459.5 388.0 459.5 394.0 V 413.0 Q 459.5 419.0 455.0 419.0 Q 459.5 419.0 459.5 425.0 V 444.0 Q 459.5 450.0 464.0 450.0"/>
<text class="rl-math-sm" x="472" y="408" text-anchor="start">1,  若 <tspan font-style="italic">a</tspan> = arg max<tspan dy="3.5" font-size="13">a′</tspan><tspan dy="-3.5">​</tspan> <tspan font-style="italic">Q</tspan><tspan dy="3.5" font-size="13" font-style="italic">ϕ</tspan><tspan dy="-3.5">​</tspan>(<tspan font-style="italic">s</tspan>, <tspan font-style="italic">a</tspan>′)</text>
<text class="rl-math-sm" x="472" y="438" text-anchor="start">0,  其他动作（otherwise）</text>
</svg>
