<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="565" viewBox="0 0 1280 565" role="img" aria-labelledby="title"><title id="title">Challenges to scale agentic RL — 根据演示截图复刻</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#111"><text x="28" y="50" font-size="42" font-weight="700">Challenges to scale agentic RL</text><rect x="38" y="165" width="565" height="365" rx="55" fill="none" stroke="#922a99" stroke-width="3"/><rect x="208" y="139" width="235" height="45" fill="white"/><text x="228" y="174" font-size="29" font-weight="700">Challenges</text><rect x="680" y="165" width="565" height="365" rx="55" fill="none" stroke="#922a99" stroke-width="3"/><rect x="850" y="139" width="235" height="45" fill="white"/><text x="870" y="174" font-size="29" font-weight="700">Our Solutions</text><text x="76" y="230" font-size="25" >1. Large scale sandbox environment</text><text x="76" y="274" font-size="25" >2. Long context inference: 128k–1M,</text><text x="76" y="318" font-size="25" >   100+ turns</text><text x="76" y="362" font-size="25" >3. Long context training</text><text x="76" y="406" font-size="25" >4. Agent harness RL: memory, tool,</text><text x="76" y="450" font-size="25" >   subagent, etc.</text><text x="76" y="494" font-size="25" >5. Effective training</text><text x="716" y="230" font-size="24" fill="#b51c16">1. veFaaS, Modal, OpenYuanRong</text><text x="716" y="274" font-size="24" fill="#111">2. KV-cache/workload-aware scheduling,</text><text x="716" y="318" font-size="24" fill="#111">   partial rollout, fp8/fp4 inference</text><text x="716" y="362" font-size="24" fill="#111">3. 5D parallelism, recompute, act offload,</text><text x="716" y="406" font-size="24" fill="#111">   fp8/fp4 training</text><text x="716" y="450" font-size="24" fill="#b51c16">4. Agent gateway (Plug in Any Harness)</text><text x="716" y="494" font-size="24" fill="#b51c16">5. Algorithm Design</text></g></svg>