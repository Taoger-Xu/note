<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="595" viewBox="0 0 1200 595" role="img" aria-labelledby="title"><title id="title">Gateway 设计：根据演示截图复刻</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Noto Sans CJK SC, sans-serif"><text x="600" y="45" font-size="36" fill="#222" text-anchor="middle">Gateway 设计</text><text x="48" y="111" font-size="26" fill="#9c4167" text-anchor="start">Gateway 与 Agent 之间通过 message 对话，与推理后端 Token In Token Out</text><rect x="44" y="150" width="284" height="94" rx="5" fill="#d4e9ca" stroke="#6e9c5b" stroke-width="1.7"/><text x="186" y="190" font-size="28" fill="#222" text-anchor="middle">Agent</text><text x="186" y="220" font-size="21" fill="#667560" text-anchor="middle">Claude Code / SWE-Agent</text><rect x="468" y="150" width="276" height="94" rx="5" fill="#d9d4e9" stroke="#62578b" stroke-width="1.7"/><text x="606" y="190" font-size="28" fill="#222" text-anchor="middle">Gateway</text><text x="606" y="220" font-size="19" fill="#6b6578" text-anchor="middle">session + trajectory processing</text><rect x="895" y="147" width="248" height="100" rx="5" fill="#c9e3f3" stroke="#3c8ea9" stroke-width="1.7"/><text x="1019" y="181" font-size="25" fill="#222" text-anchor="middle">Inference Backend</text><text x="1019" y="222" font-size="22" fill="#687882" text-anchor="middle">vLLM / SGLang</text><path d="M328 195 L466 195" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="396" y="220" font-size="16" fill="#777" text-anchor="middle">OpenAI / Anthropic</text><text x="396" y="240" font-size="16" fill="#777" text-anchor="middle">compatible</text><path d="M744 195 L892 195" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="818" y="222" font-size="17" fill="#777" text-anchor="middle">backend.generate()</text><rect 