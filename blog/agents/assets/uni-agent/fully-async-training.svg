<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title"><title id="title">Fully Asynchronous Training：根据演示截图复刻</title><rect width="100%" height="100%" fill="#faf9ff"/><g font-family="Arial, Noto Sans CJK SC, sans-serif"><text x="32" y="55" font-size="42" fill="#222">Our Solution:</text><text x="308" y="55" font-size="42" fill="#d33f69">Fully</text><text x="425" y="55" font-size="42" fill="#222">Asynchronous Training</text><text x="30" y="116" font-size="21" fill="#222">Inference Servers</text><text x="220" y="96" font-size="22" fill="#b94c70">训练时推理引擎继续工作</text><rect x="235" y="122" width="53" height="65" rx="10" fill="#cde7dc" stroke="#45606a" stroke-width="1.6"/><text x="243" y="161" font-size="24" fill="#222">πₜ</text><rect x="560" y="122" width="53" height="65" rx="10" fill="#cce4f5" stroke="#45606a" stroke-width="1.6"/><text x="568" y="161" font-size="24" fill="#222">πₜ₊₁</text><rect x="50" y="177" width="416" height="17" rx="0" fill="#d3e8df" stroke="#45606a" stroke-width="1.6"/><rect x="479" y="177" width="137" height="17" rx="0" fill="#cee5f5" stroke="#45606a" stroke-width="1.6"/><path d="M233 177 v17" stroke="#45606a"/><path d="M410 177 v17" stroke="#45606a"/><rect x="50" y="195" width="416" height="17" rx="0" fill="#d3e8df" stroke="#45606a" stroke-width="1.6"/><rect x="479" y="195" width="149" height="17" rx="0" fill="#cee5f5" stroke="#45606a" stroke-width="1.6"/><path d="M350 195 v17" stroke="#45606a"/><path d="M436 195 v17" stroke="#45606a"/><rect x="50" y="213" width="416" height="17" rx="0" fill="#d3e8df" stroke="#45606a" stroke-width="1.6"/><rect x="479" y="213" width="125" height="17" rx="0" fill="#cee5f5" stroke="#45606a" stroke-width="1.6"/><path d="M315 213 v17" stroke="#45606a"/><path d="M383 213 v17" stroke="#45606a"/><rect x="50" y="231" width="416" height="17" rx="0" fill="#d3e8df" stroke="#45606a" stroke-width="1.6"/><rect x="479" y="231" width="134" height="17" rx="0" fill="#